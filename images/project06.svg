<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Simple Car</title>
  <desc id="desc">A stylized simple robot car with two wheels and a lightweight frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#ecf4f3" />
      <stop offset="100%" stop-color="#dfeeea" />
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f6f68" />
      <stop offset="100%" stop-color="#1d3a34" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6c98d" />
      <stop offset="100%" stop-color="#e8a85f" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />
  <g opacity="0.25" stroke="#7ea29d" stroke-width="2">
    <path d="M0 80 H800 M0 160 H800 M0 240 H800 M0 320 H800 M0 400 H800 M0 480 H800" />
    <path d="M120 0 V600 M240 0 V600 M360 0 V600 M480 0 V600 M600 0 V600 M720 0 V600" />
  </g>

  <g>
    <ellipse cx="220" cy="430" rx="118" ry="118" fill="#1e2f2b" />
    <ellipse cx="220" cy="430" rx="72" ry="72" fill="#dfeeea" />
    <circle cx="220" cy="430" r="22" fill="#1d3a34" />

    <ellipse cx="580" cy="430" rx="118" ry="118" fill="#1e2f2b" />
    <ellipse cx="580" cy="430" rx="72" ry="72" fill="#dfeeea" />
    <circle cx="580" cy="430" r="22" fill="#1d3a34" />

    <path d="M150 320 L410 260 L560 260 L680 330 L680 360 L150 360 Z" fill="url(#body)" />
    <path d="M230 260 L350 205 L465 205 L520 260 L230 260 Z" fill="#2c5d5d" opacity="0.92" />
    <rect x="260" y="205" width="110" height="56" rx="14" fill="url(#accent)" />
    <rect x="470" y="210" width="34" height="34" rx="8" fill="#f9d9a7" opacity="0.9" />
    <rect x="150" y="335" width="114" height="26" rx="12" fill="#f2b15c" opacity="0.88" />
    <rect x="600" y="335" width="80" height="26" rx="12" fill="#f2b15c" opacity="0.88" />

    <g stroke="#f4f0e8" stroke-width="8" stroke-linecap="round" opacity="0.8">
      <path d="M190 285 L270 285" />
      <path d="M460 285 L535 285" />
    </g>
  </g>
</svg>
